[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os

# FIXED: the original file hard-coded real credentials here, which is a
# security bad practice (credentials end up in version control).
# The actual DATABASE_URL is injected at runtime by migrations/env.py, which
# reads the DATABASE_URL environment variable.  This placeholder is therefore
# never used but must be present so Alembic can parse the config file.
sqlalchemy.url = driver://user:pass@host/dbname

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
